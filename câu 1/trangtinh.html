<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy tính BMI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(45deg, #2196f3, #4CAF50);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        .calculator:hover {
            transform: translateY(-5px);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .form-group {
            position: relative;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }

        input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.3);
            outline: none;
        }

        button {
            width: 100%;
            background: #4CAF50;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(69, 160, 73, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.8);
            text-align: center;
            font-size: 18px;
            color: #333;
            transition: all 0.3s ease;
        }

        .error {
            color: #e74c3c;
            margin-top: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.3s ease-in-out;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator">
        <h1>Máy tính BMI</h1>
        <div class="form-group">
            <label for="weight">Cân nặng (kg):</label>
            <input type="text" id="weight" placeholder="Nhập cân nặng" onkeydown="if(event.key === 'Enter') document.getElementById('height').focus()">
            <div id="weightError" class="error"></div>
        </div>
        <div class="form-group">
            <label for="height">Chiều cao (cm):</label>
            <input type="text" id="height" placeholder="Nhập chiều cao" onkeydown="if(event.key === 'Enter') calculateBMI()">
            <div id="heightError" class="error"></div>
        </div>
        <button onclick="calculateBMI()">Tính toán</button>
        <div id="result" class="result"></div>
    </div>

    <script>
        function calculateBMI() {
            // Reset error messages
            document.getElementById('weightError').textContent = '';
            document.getElementById('heightError').textContent = '';
            document.getElementById('result').textContent = '';
            
            // Get input values
            const weight = document.getElementById('weight').value.trim();
            const height = document.getElementById('height').value.trim();
            const calculator = document.querySelector('.calculator');

            // Validate weight
            if (!weight) {
                document.getElementById('weightError').textContent = 'Vui lòng nhập cân nặng';
                calculator.classList.add('shake');
                setTimeout(() => calculator.classList.remove('shake'), 500);
                return;
            }

            if (isNaN(weight)) {
                document.getElementById('weightError').textContent = 'Cân nặng phải là số';
                calculator.classList.add('shake');
                setTimeout(() => calculator.classList.remove('shake'), 500);
                return;
            }

            // Validate height
            if (!height) {
                document.getElementById('heightError').textContent = 'Vui lòng nhập chiều cao';
                calculator.classList.add('shake');
                setTimeout(() => calculator.classList.remove('shake'), 500);
                return;
            }

            if (isNaN(height)) {
                document.getElementById('heightError').textContent = 'Chiều cao phải là số';
                calculator.classList.add('shake');
                setTimeout(() => calculator.classList.remove('shake'), 500);
                return;
            }

            // Convert height from cm to m
            const heightInMeters = parseFloat(height) / 100;
            const bmi = parseFloat(weight) / (heightInMeters * heightInMeters);
            
            // Create result message with classification
            let resultMessage = `Chỉ số BMI của bạn là: ${bmi.toFixed(2)}<br>`;
            let resultColor = '';
            
            if (bmi < 18.5) {
                resultMessage += 'Phân loại: Thiếu cân';
                resultColor = '#3498db';
            } else if (bmi < 25) {
                resultMessage += 'Phân loại: Bình thường';
                resultColor = '#2ecc71';
            } else if (bmi < 30) {
                resultMessage += 'Phân loại: Thừa cân';
                resultColor = '#f1c40f';
            } else {
                resultMessage += 'Phân loại: Béo phì';
                resultColor = '#e74c3c';
            }

            const resultElement = document.getElementById('result');
            resultElement.innerHTML = resultMessage;
            resultElement.style.backgroundColor = `${resultColor}20`;
            resultElement.style.color = resultColor;
            resultElement.style.border = `2px solid ${resultColor}`;
        }

        // Add input animations
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').style.color = '#4CAF50';
            });
            
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').style.color = '#555';
            });
        });
    </script>
</body>
</html>
